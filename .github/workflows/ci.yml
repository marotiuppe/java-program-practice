name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-practice-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: java-practice-app/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: pip install -r requirements.txt httpx
      - name: Question tests match their reference solutions
        run: python tools/validate_tests.py
      - name: Predict-the-output snippets are stable
        run: python tools/check_predict.py
      - name: Compile-error help covers real javac output
        run: python tools/check_hints.py
      - name: Sandbox blocks the network and still runs normal programs
        run: python tools/check_sandbox.py
      - name: Smoke test of the main flows
        run: python tools/smoke_test.py
