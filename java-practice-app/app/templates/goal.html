{% extends "base.html" %}
{% block title %}Daily goal{% endblock %}
{% block content %}
<section class="card">
  <h1>Set your daily goal</h1>
  <p class="muted">How many questions do you want to solve each day? Small and steady beats big and rare. You can change this any time.</p>
  <form method="post" action="/goal" class="levels">
    <input type="hidden" name="first" value="{{ '1' if first else '' }}">
    {% for g in goals %}
      <button name="goal" value="{{ g }}" class="level {{ 'current' if g == current else '' }}">
        <strong>{{ g }} question{{ '' if g == 1 else 's' }} a day</strong>
        <span>{{ {1: 'Easy to keep up. Recommended to start.', 3: 'A solid daily session.', 5: 'A full day of the plan.'}[g] }}</span>
      </button>
    {% endfor %}
  </form>
</section>
{% endblock %}
