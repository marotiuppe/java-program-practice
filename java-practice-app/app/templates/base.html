<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Java Practice{% endblock %}</title>
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Java Practice">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/logo.svg" width="30" height="30" alt="">Java Practice</a>
  <nav>
    {% if user %}
      <button id="install-app" class="link" type="button" hidden>Install app</button>
      <a href="/dashboard">Dashboard</a>
      <a href="/profile">Profile</a>
      <a href="/level">Level</a>
      {% if is_admin %}<a href="/admin">Admin</a>{% endif %}
      <span class="who"><span class="avatar">{{ user.email[:1] | upper }}</span><span class="muted">{{ user.email }}</span>
      <form method="post" action="/logout" class="inline"><button class="link">Log out</button></form></span>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/pwa.js"></script>
</body>
</html>
