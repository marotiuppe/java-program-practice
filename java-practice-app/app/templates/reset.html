{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="card narrow auth-card">
  <h1>Choose a new password</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/reset/{{ token }}">
    <label>New password <input type="password" name="password" required minlength="8" autocomplete="new-password" autofocus></label>
    <button class="primary">Change password</button>
  </form>
</section>
{% endblock %}
